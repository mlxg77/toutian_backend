version: "3.9"

services:
  # ================== Redis 缓存 ==================
  redis:
    image: redis:7-alpine
    container_name: news_redis
    restart: unless-stopped
    # Redis 只在 Docker 内部网络暴露，不映射到宿主机，更安全
    # 如需从宿主机调试，改成 "6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - news_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ================== FastAPI 后端 ==================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # 环境变量从项目根目录的 .env 文件读取（不要把密码硬编码在这里）
    # 修改 .env 后需要重启：docker compose down && docker compose up -d
    env_file:
      - .env
    # 日志挂载：容器内 /app/log 映射到宿主机当前目录的 log/
    # 应用日志（含 uvicorn 访问日志）按天滚动写到 app.log，宿主机直接打开看
    volumes:
      - ./log:/app/log
    # 让容器能解析 host.docker.internal 到宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - news_net

volumes:
  redis_data:

networks:
  news_net:
    driver: bridge
